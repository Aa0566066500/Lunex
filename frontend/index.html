<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#08090d"
  >

  <meta
    name="description"
    content="Lunex — AI Engineering Studio for Roblox and Luau"
  >

  <title>Lunex — Roblox AI Engineering Studio</title>

  <link rel="stylesheet" href="/app.css">
</head>

<body>

  <!-- =====================================================
       APPLICATION
  ====================================================== -->

  <div id="app" class="app">

    <!-- ===================================================
         SIDEBAR
    ==================================================== -->

    <aside id="sidebar" class="sidebar">

      <div class="sidebar-top">

        <div class="brand">

          <div class="brand-logo" aria-label="Lunex">
            <svg
              viewBox="0 0 48 48"
              width="34"
              height="34"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M24 5L28.7 18.3L43 24L28.7 29.7L24 43L19.3 29.7L5 24L19.3 18.3L24 5Z"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linejoin="round"
              />
              <circle
                cx="24"
                cy="24"
                r="3.2"
                fill="currentColor"
              />
            </svg>
          </div>

          <div class="brand-info">
            <strong>Lunex</strong>
            <span>Engineering Studio</span>
          </div>

        </div>

        <button
          id="newChatButton"
          class="new-chat-button"
          type="button"
        >
          <span class="button-icon">
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M12 5V19"/>
              <path d="M5 12H19"/>
            </svg>
          </span>

          <span>محادثة جديدة</span>
        </button>

      </div>

      <!-- NAVIGATION -->

      <nav class="navigation" aria-label="التنقل">

        <button class="nav-button active" type="button">

          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M20 11.5a8 8 0 0 1-8 8H7l-4 2v-5a8 8 0 1 1 17-5Z"/>
          </svg>

          <span>المحادثة</span>

        </button>

        <button class="nav-button" type="button">

          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M4 5h16v14H4z"/>
            <path d="M8 9h8"/>
            <path d="M8 13h5"/>
          </svg>

          <span>المشروع</span>

        </button>

        <button class="nav-button" type="button">

          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <rect x="4" y="4" width="16" height="16" rx="2"/>
            <path d="M8 9h8"/>
            <path d="M8 13h5"/>
          </svg>

          <span>محرر الكود</span>

        </button>

        <button class="nav-button" type="button">

          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3Z"/>
            <path d="M9 12l2 2 4-5"/>
          </svg>

          <span>فحص الأمان</span>

        </button>

        <button class="nav-button" type="button">

          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M12 3v18"/>
            <path d="M3 12h18"/>
            <path d="M5 5l14 14"/>
            <path d="M19 5L5 19"/>
          </svg>

          <span>مصمم الواجهات</span>

        </button>

      </nav>

      <!-- SIDEBAR FOOTER -->

      <div class="sidebar-footer">

        <div class="system-status">

          <span class="status-indicator"></span>

          <div>
            <strong>النظام جاهز</strong>
            <small>AI Engine</small>
          </div>

        </div>

        <button
          id="settingsButton"
          class="icon-button"
          type="button"
          aria-label="الإعدادات"
        >

          <svg
            viewBox="0 0 24 24"
            width="19"
            height="19"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06-1.7 1.7-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V20h-2.4v-.21a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06-1.7-1.7.06-.06A1.7 1.7 0 0 0 8.4 15a1.7 1.7 0 0 0-1.56-1.03H6.6v-2.4h.24A1.7 1.7 0 0 0 8.4 10a1.7 1.7 0 0 0-.34-1.87L8 8.07l1.7-1.7.06.06a1.7 1.7 0 0 0 1.87.34 1.7 1.7 0 0 0 1.03-1.56V5h2.4v.21a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06 1.7 1.7-.06.06A1.7 1.7 0 0 0 19.4 10a1.7 1.7 0 0 0 1.56 1.03h.24v2.4h-.24A1.7 1.7 0 0 0 19.4 15Z"/>
          </svg>

        </button>

      </div>

    </aside>


    <!-- ===================================================
         MAIN
    ==================================================== -->

    <main class="main">

      <!-- TOPBAR -->

      <header class="topbar">

        <div class="topbar-right">

          <button
            id="mobileMenuButton"
            class="mobile-menu-button"
            type="button"
            aria-label="فتح القائمة"
          >
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M4 6h16"/>
              <path d="M4 12h16"/>
              <path d="M4 18h16"/>
            </svg>
          </button>

          <div class="model-status">

            <span class="status-indicator"></span>

            <span>Roblox / Luau Expert</span>

          </div>

        </div>

        <div class="topbar-left">

          <button
            class="topbar-icon"
            type="button"
            aria-label="البحث"
          >
            <svg
              viewBox="0 0 24 24"
              width="19"
              height="19"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <circle cx="11" cy="11" r="6.5"/>
              <path d="M16 16l5 5"/>
            </svg>
          </button>

          <button
            class="topbar-icon"
            type="button"
            aria-label="الإشعارات"
          >
            <svg
              viewBox="0 0 24 24"
              width="19"
              height="19"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
              <path d="M10 21h4"/>
            </svg>
          </button>

        </div>

      </header>


      <!-- =================================================
           CHAT AREA
      ================================================== -->

      <section
        id="chat"
        class="chat"
        aria-live="polite"
      >

        <!-- WELCOME -->

        <div
          id="welcome"
          class="welcome"
        >

          <div class="welcome-logo">

            <svg
              viewBox="0 0 64 64"
              width="58"
              height="58"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M32 5L38.2 25.8L59 32L38.2 38.2L32 59L25.8 38.2L5 32L25.8 25.8L32 5Z"
                stroke="currentColor"
                stroke-width="2.8"
                stroke-linejoin="round"
              />

              <circle
                cx="32"
                cy="32"
                r="4.5"
                fill="currentColor"
              />

            </svg>

          </div>

          <h1>وش نبني اليوم؟</h1>

          <p>
            Lunex يساعدك في بناء وتحليل وتطوير مشاريع
            Roblox وLuau بطريقة احترافية.
          </p>


          <!-- SUGGESTIONS -->

          <div class="suggestions">

            <button
              class="suggestion"
              type="button"
              data-prompt="صمم لي واجهة متجر Roblox احترافية ومتجاوبة"
            >

              <span class="suggestion-icon">
                <svg
                  viewBox="0 0 24 24"
                  width="20"
                  height="20"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path d="M5 8h14l-1 11H6L5 8Z"/>
                  <path d="M8 8a4 4 0 0 1 8 0"/>
                </svg>
              </span>

              <span>
                <strong>واجهة متجر</strong>
                <small>صمم UI احترافي</small>
              </span>

            </button>


            <button
              class="suggestion"
              type="button"
              data-prompt="حلل لي نظام RemoteEvent في Roblox من ناحية الأمان"
            >

              <span class="suggestion-icon">
                <svg
                  viewBox="0 0 24 24"
                  width="20"
                  height="20"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3Z"/>
                  <path d="M9 12l2 2 4-5"/>
                </svg>
              </span>

              <span>
                <strong>فحص الأمان</strong>
                <small>حلل نظامك</small>
              </span>

            </button>


            <button
              class="suggestion"
              type="button"
              data-prompt="اكتب لي نظام Inventory كامل ومنظم باستخدام Luau"
            >

              <span class="suggestion-icon">
                <svg
                  viewBox="0 0 24 24"
                  width="20"
                  height="20"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <rect x="4" y="4" width="16" height="16" rx="2"/>
                  <path d="M8 9h8"/>
                  <path d="M8 13h5"/>
                </svg>
              </span>

              <span>
                <strong>نظام Inventory</strong>
                <small>اكتب النظام كاملًا</small>
              </span>

            </button>


            <button
              class="suggestion"
              type="button"
              data-prompt="راجع هذا الكود وحاول اكتشاف الأخطاء والمشاكل وتحسينه"
            >

              <span class="suggestion-icon">
                <svg
                  viewBox="0 0 24 24"
                  width="20"
                  height="20"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path d="M4 5h16v14H4z"/>
                  <path d="M8 9h8"/>
                  <path d="M8 13h5"/>
                </svg>
              </span>

              <span>
                <strong>مراجعة الكود</strong>
                <small>اكتشف المشاكل</small>
              </span>

            </button>

          </div>

        </div>

      </section>


      <!-- =================================================
           COMPOSER
      ================================================== -->

      <div class="composer-container">

        <form
          id="composer"
          class="composer"
        >

          <div class="composer-main">

            <textarea
              id="messageInput"
              name="message"
              rows="1"
              maxlength="20000"
              autocomplete="off"
              placeholder="اكتب طلبك لـ Lunex..."
              aria-label="رسالة"
            ></textarea>

            <button
              id="sendButton"
              class="send-button"
              type="submit"
              aria-label="إرسال"
            >

              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M22 2L11 13"/>
                <path d="M22 2L15 22L11 13L2 9L22 2Z"/>
              </svg>

            </button>

          </div>


          <div class="composer-footer">

            <div class="composer-tools">

              <button
                type="button"
                class="composer-tool"
                title="إرفاق ملف"
              >

                <svg
                  viewBox="0 0 24 24"
                  width="17"
                  height="17"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path d="M21 11.5l-8.7 8.7a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.6-8.6"/>
                </svg>

                <span>ملف</span>

              </button>


              <button
                type="button"
                class="composer-tool"
                title="تحليل الكود"
              >

                <svg
                  viewBox="0 0 24 24"
                  width="17"
                  height="17"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path d="M8 9l-3 3 3 3"/>
                  <path d="M16 9l3 3-3 3"/>
                  <path d="M14 5l-4 14"/>
                </svg>

                <span>كود</span>

              </button>

            </div>

            <span class="composer-hint">
              Enter للإرسال · Shift + Enter لسطر جديد
            </span>

          </div>

        </form>

        <p class="disclaimer">
          Lunex قد يخطئ أحيانًا. راجع الكود واختبره داخل Roblox Studio قبل استخدامه.
        </p>

      </div>

    </main>

  </div>


  <!-- =====================================================
       SCRIPT
  ====================================================== -->

  <script src="/app.js"></script>

</body>
</html>
